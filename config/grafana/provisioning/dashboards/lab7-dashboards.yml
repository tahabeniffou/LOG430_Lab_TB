apiVersion: 1

providers:
  # Configuration des dashboards LAB 7 - Event-Driven Architecture
  - name: 'LAB7-EventDriven'
    orgId: 1
    folder: 'LAB 7 - Event-Driven Architecture'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/lab7

  # Configuration des dashboards RabbitMQ
  - name: 'RabbitMQ-Topics'
    orgId: 1
    folder: 'RabbitMQ Monitoring'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/rabbitmq

  # Configuration des dashboards existants (LAB 5-6)
  - name: 'Microservices-Saga'
    orgId: 1
    folder: 'Microservices & Saga'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/microservices
