events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Configuration des logs
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Configuration générale
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Configuration des upstreams pour chaque microservice
    upstream product_service {
        server product-management-service:3001;
    }

    upstream sales_service {
        server sales-service:3002;
    }

    upstream inventory_service {
        server inventory-service:3003;
    }

    upstream reporting_service {
        server reporting-service:3004;
    }

    upstream customer_account_service {
        server customer-account-service:3005;
    }

    upstream shopping_cart_service {
        server shopping-cart-service:3006;
    }

    upstream order_validation_service {
        server order-validation-service:3007;
    }

    # Serveur principal - API Gateway
    server {
        listen 80;
        server_name localhost;

        # Configuration générale
        client_max_body_size 10M;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Health check global
        location /health {
            add_header Content-Type application/json;
            return 200 '{"status":"healthy","service":"api-gateway","timestamp":"$time_iso8601"}';
        }

        # Routes pour le Product Service
        location /api/products/ {
            proxy_pass http://product_service;
            proxy_timeout 10s;
            proxy_connect_timeout 5s;
        }

        # Routes pour le Sales Service
        location /api/sales/ {
            proxy_pass http://sales_service;
            proxy_timeout 10s;
            proxy_connect_timeout 5s;
        }

        # Routes pour l'Inventory Service
        location /api/inventory/ {
            proxy_pass http://inventory_service;
            proxy_timeout 15s;
            proxy_connect_timeout 5s;
        }

        # Routes pour le Reporting Service
        location /api/reports/ {
            proxy_pass http://reporting_service;
            proxy_timeout 20s;
            proxy_connect_timeout 5s;
        }

        # Routes pour le Customer Account Service
        location /api/customers/ {
            proxy_pass http://customer_account_service;
            proxy_timeout 10s;
            proxy_connect_timeout 5s;
        }

        # Routes pour le Shopping Cart Service
        location /api/cart/ {
            proxy_pass http://shopping_cart_service;
            proxy_timeout 10s;
            proxy_connect_timeout 5s;
        }

        # Routes pour l'Order Validation Service
        location /api/orders/ {
            proxy_pass http://order_validation_service;
            proxy_timeout 20s;
            proxy_connect_timeout 5s;
        }

        # Health checks individuels des services
        location /health/sales {
            proxy_pass http://sales_service/health;
        }

        location /health/inventory {
            proxy_pass http://inventory_service/health;
        }

        location /health/stores {
            proxy_pass http://store_management_service/health;
        }

        location /health/customers {
            proxy_pass http://customer_account_service/health;
        }

        location /health/cart {
            proxy_pass http://shopping_cart_service/health;
        }

        location /health/orders {
            proxy_pass http://order_validation_service/health;
        }

        # Métriques Prometheus consolidées
        location /metrics {
            add_header Content-Type text/plain;
            return 200 'API Gateway - Voir les métriques individuelles des services\n';
        }

        location /metrics/sales {
            proxy_pass http://sales_service/metrics;
        }

        location /metrics/inventory {
            proxy_pass http://inventory_service/metrics;
        }

        location /metrics/stores {
            proxy_pass http://store_management_service/metrics;
        }

        location /metrics/customers {
            proxy_pass http://customer_account_service/metrics;
        }

        location /metrics/cart {
            proxy_pass http://shopping_cart_service/metrics;
        }

        location /metrics/orders {
            proxy_pass http://order_validation_service/metrics;
        }

        # Interface de documentation API (optionnel)
        location /docs {
            add_header Content-Type text/html;
            return 200 '
<!DOCTYPE html>
<html>
<head>
    <title>API Gateway - Microservices Magasin</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .service { border: 1px solid #ccc; margin: 20px 0; padding: 15px; }
        .endpoint { background: #f5f5f5; padding: 5px; margin: 5px 0; }
        code { background: #eee; padding: 2px 5px; }
    </style>
</head>
<body>
    <h1>🏪 API Gateway - Système de Magasin Microservices</h1>
    
    <div class="service">
        <h2>🛒 Sales Service (Port 3001)</h2>
        <div class="endpoint">GET <code>/api/sales/transactions</code> - Liste des ventes</div>
        <div class="endpoint">POST <code>/api/sales/transactions</code> - Créer une vente</div>
        <div class="endpoint">GET <code>/api/sales/transactions/:id</code> - Détails vente</div>
    </div>
    
    <div class="service">
        <h2>📦 Inventory Service (Port 3002)</h2>
        <div class="endpoint">GET <code>/api/inventory/stock/:productId/:magasinId</code> - Stock local</div>
        <div class="endpoint">POST <code>/api/inventory/movement</code> - Mouvement de stock</div>
        <div class="endpoint">GET <code>/api/inventory/central/stock</code> - Stock global</div>
    </div>
    
    <div class="service">
        <h2>🏪 Store Management Service (Port 3003)</h2>
        <div class="endpoint">GET <code>/api/stores</code> - Liste des magasins</div>
        <div class="endpoint">GET <code>/api/stores/:id/employees</code> - Employés</div>
        <div class="endpoint">POST <code>/api/stores/auth/verify</code> - Authentification</div>
    </div>
    
    <div class="service">
        <h2>👥 Customer Account Service (Port 3004)</h2>
        <div class="endpoint">POST <code>/api/customers/register</code> - Créer compte client</div>
        <div class="endpoint">GET <code>/api/customers/:id/profile</code> - Profil client</div>
        <div class="endpoint">PUT <code>/api/customers/:id/loyalty-points</code> - Points fidélité</div>
    </div>
    
    <div class="service">
        <h2>🛍️ Shopping Cart Service (Port 3005)</h2>
        <div class="endpoint">POST <code>/api/cart/create</code> - Créer panier</div>
        <div class="endpoint">POST <code>/api/cart/:id/items</code> - Ajouter article</div>
        <div class="endpoint">GET <code>/api/cart/:id/total</code> - Calculer total</div>
    </div>
    
    <div class="service">
        <h2>✅ Order Validation Service (Port 3006)</h2>
        <div class="endpoint">POST <code>/api/orders/validate</code> - Valider commande</div>
        <div class="endpoint">POST <code>/api/orders/:id/payment</code> - Traiter paiement</div>
        <div class="endpoint">GET <code>/api/orders/:id/receipt</code> - Générer reçu</div>
    </div>
    
    <h2>🔧 Monitoring</h2>
    <div class="endpoint">GET <code>/health</code> - Santé API Gateway</div>
    <div class="endpoint">GET <code>/health/{service}</code> - Santé service spécifique</div>
    <div class="endpoint">GET <code>/metrics/{service}</code> - Métriques Prometheus</div>
</body>
</html>';
        }

        # Route par défaut - 404
        location / {
            add_header Content-Type application/json;
            return 404 '{"error":"Route non trouvée","gateway":"microservices-api-gateway","suggestion":"Consultez /docs pour la documentation"}';
        }
    }
}
