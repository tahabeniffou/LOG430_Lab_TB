global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # API Gateway metrics
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:9000']
    metrics_path: '/metrics'
    scrape_interval: 5s
    scrape_timeout: 5s

  # Produit Service metrics
  - job_name: 'produit-service'
    static_configs:
      - targets: ['produit-service:3001']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Stock Service metrics
  - job_name: 'stock-service'
    static_configs:
      - targets: ['stock-service:3002']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Vente Service metrics
  - job_name: 'vente-service'
    static_configs:
      - targets: ['vente-service:3004']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Reporting Service metrics
  - job_name: 'reporting-service'
    static_configs:
      - targets: ['reporting-service:3005']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Legacy Application metrics
  - job_name: 'legacy-app'
    static_configs:
      - targets: ['legacy-app:3000']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # System metrics via Node Exporter
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
