_format_version: "3.0"
_transform: true

services:
  # =======================================
  # ROUTEUR HYBRIDE PRINCIPAL
  # =======================================
  - name: hybrid-router
    url: http://hybrid-router:9000
    plugins:
      # Rate Limiting avancé
      - name: rate-limiting
        config:
          minute: 200
          hour: 5000
          policy: local
          fault_tolerant: true
          hide_client_headers: false
      
      # CORS sécurisé
      - name: cors
        config:
          origins:
            - "http://localhost:3000"
            - "http://localhost:9000"
            - "http://localhost:8000"
            - "https://localhost:*"
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
            - PATCH
          headers:
            - Accept
            - Accept-Version
            - Content-Length
            - Content-MD5
            - Content-Type
            - Date
            - Authorization
            - X-Client-Type
            - X-API-Key
            - X-Requested-With
          exposed_headers:
            - X-Auth-Token
            - X-Source-Service
            - X-Rate-Limit-Remaining
            - X-Response-Time
          credentials: true
          max_age: 3600
          preflight_continue: false
      
      # Logging et monitoring
      - name: file-log
        config:
          path: /tmp/kong-access.log
          
      # Request/Response transformation
      - name: response-transformer
        config:
          add:
            headers:
              - "X-Gateway: Kong-Hybrid"
              - "X-Service: Hybrid-Router"
      
      # Security headers
      - name: request-transformer
        config:
          add:
            headers:
              - "X-Forwarded-By: Kong-Gateway"

  # =======================================
  # SYSTÈME DE BASE (LEGACY)
  # =======================================
  - name: legacy-system
    url: http://legacy-system:3000
    plugins:
      - name: rate-limiting
        config:
          minute: 150
      - name: cors
        config:
          origins:
            - "*"

  # =======================================
  # MICROSERVICES DIRECTS
  # =======================================
  - name: produit-service
    url: http://produit-service-1:3001
    plugins:
      - name: rate-limiting
        config:
          minute: 100
      - name: cors
        config:
          origins:
            - "*"

  - name: vente-service
    url: http://vente-service:3004
    plugins:
      - name: rate-limiting
        config:
          minute: 100
      - name: cors
        config:
          origins:
            - "*"

  - name: stock-service
    url: http://stock-service:3007
    plugins:
      - name: rate-limiting
        config:
          minute: 100
      - name: cors
        config:
          origins:
            - "*"

  - name: reporting-service
    url: http://reporting-service:3008
    plugins:
      - name: rate-limiting
        config:
          minute: 50
      - name: cors
        config:
          origins:
            - "*"

routes:
  # =======================================
  # ROUTES PRINCIPALES (VIA ROUTEUR HYBRIDE)
  # =======================================
  
  # Routes pour consoles POS
  - name: pos-routes
    service: hybrid-router
    paths:
      - /pos
    methods:
      - GET
      - POST
      - PUT
      - DELETE

  # Routes pour consoles Maison Mère
  - name: maisonmere-routes
    service: hybrid-router
    paths:
      - /maisonmere
    methods:
      - GET
      - POST
      - PUT
      - DELETE

  # Routes API v2 (microservices via routeur)
  - name: api-v2-routes
    service: hybrid-router
    paths:
      - /api/v2
    methods:
      - GET
      - POST
      - PUT
      - DELETE

  # Routes API v1 (legacy via routeur)
  - name: api-v1-routes
    service: hybrid-router
    paths:
      - /api/v1
    methods:
      - GET
      - POST
      - PUT
      - DELETE

  # Route d'information du routeur
  - name: routing-info
    service: hybrid-router
    paths:
      - /routing-info
    methods:
      - GET

  # =======================================
  # ROUTES DIRECTES (ACCÈS MICROSERVICES)
  # =======================================
  
  # Accès direct au système de base
  - name: legacy-direct
    service: legacy-system
    paths:
      - /legacy
    strip_path: true

  # Accès direct aux microservices
  - name: produit-direct
    service: produit-service
    paths:
      - /direct/produits
    strip_path: true

  - name: vente-direct
    service: vente-service
    paths:
      - /direct/ventes
    strip_path: true

  - name: stock-direct
    service: stock-service
    paths:
      - /direct/stocks
    strip_path: true

  - name: reporting-direct
    service: reporting-service
    paths:
      - /direct/reports
    strip_path: true

# =======================================
# LOAD BALANCING POUR PRODUITS
# =======================================
upstreams:
  - name: produit-upstream
    targets:
      - target: produit-service-1:3001
        weight: 100
      - target: produit-service-2:3005
        weight: 100
      - target: produit-service-3:3006
        weight: 100
    healthchecks:
      active:
        healthy:
          interval: 10
          successes: 3
        unhealthy:
          interval: 10
          tcp_failures: 3
          http_failures: 3
        http_path: /health
      passive:
        healthy:
          successes: 3
        unhealthy:
          http_failures: 3

# =======================================
# PLUGINS GLOBAUX
# =======================================
plugins:
  - name: prometheus
    config:
      per_consumer: false
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true

  - name: request-id
    config:
      header_name: X-Request-ID
      echo_downstream: true

  - name: correlation-id
    config:
      header_name: X-Correlation-ID
      echo_downstream: true
