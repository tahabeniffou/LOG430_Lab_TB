global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first.rules"
  # - "second.rules"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'produit-service-1'
    static_configs:
      - targets: ['produit-service-1:3001']
    metrics_path: '/metrics'

  - job_name: 'produit-service-2'
    static_configs:
      - targets: ['produit-service-2:3005']
    metrics_path: '/metrics'

  - job_name: 'produit-service-3'
    static_configs:
      - targets: ['produit-service-3:3006']
    metrics_path: '/metrics'

  - job_name: 'vente-service'
    static_configs:
      - targets: ['vente-service:3004']
    metrics_path: '/metrics'

  - job_name: 'stock-service'
    static_configs:
      - targets: ['stock-service:3007']
    metrics_path: '/metrics'

  - job_name: 'reporting-service'
    static_configs:
      - targets: ['reporting-service:3008']
    metrics_path: '/metrics'

  - job_name: 'kong-gateway'
    static_configs:
      - targets: ['kong:8001']
    metrics_path: '/metrics'
