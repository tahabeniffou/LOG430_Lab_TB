events {
    worker_connections 1024;
}

http {
    upstream legacy_backend {
        server legacy-system:3200;
    }
    
    upstream produit_backend {
        server produit-service:3001;
    }
    
    upstream stock_backend {
        server stock-service:3002;
    }
    
    upstream vente_backend {
        server vente-service:3003;
    }
    
    upstream reporting_backend {
        server reporting-service:3004;
    }

    server {
        listen 80;
        
        # Legacy routes
        location /api/v1/ {
            proxy_pass http://legacy_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        # Microservices routes
        location /api/produits {
            proxy_pass http://produit_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        location /api/stock {
            proxy_pass http://stock_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        location /api/ventes {
            proxy_pass http://vente_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        location /api/rapports {
            proxy_pass http://reporting_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        # Health check
        location /health {
            return 200 'Gateway OK';
            add_header Content-Type text/plain;
        }
    }
}
