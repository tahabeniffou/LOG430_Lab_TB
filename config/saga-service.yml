  # =====================================
  # SAGA ORCHESTRATOR SERVICE
  # =====================================
  saga-orchestrator-service:
    build:
      context: ./microservices/saga-orchestrator-service
      dockerfile: Dockerfile
    environment:
      - PORT=8010
      - NODE_ENV=production
      - INSTANCE_ID=saga-orchestrator-1
      - INSTANCE_NAME=Saga Orchestrator Service
      - PRODUIT_SERVICE_URL=http://kong:8000/api/produits
      - STOCK_SERVICE_URL=http://kong:8000/api/stocks
      - VENTE_SERVICE_URL=http://kong:8000/api/ventes
      - COMPTE_SERVICE_URL=http://kong:8000/api/comptes
      - LOG_LEVEL=info
    ports:
      - "8010:8010"
    depends_on:
      - kong
      - produit-service-1
      - stock-service-1
      - vente-service-1
      - compte-service-1
    networks:
      - pos-network
    volumes:
      - ./microservices/saga-orchestrator-service/logs:/usr/src/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8010/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
