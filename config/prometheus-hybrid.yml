global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # =======================================
  # PROMETHEUS SELF-MONITORING
  # =======================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # =======================================
  # SYSTÈME DE BASE (LEGACY)
  # =======================================
  - job_name: 'legacy-system'
    static_configs:
      - targets: ['legacy-system:3000']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

  # =======================================
  # ROUTEUR HYBRIDE
  # =======================================
  - job_name: 'hybrid-router'
    static_configs:
      - targets: ['hybrid-router:9000']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # =======================================
  # MICROSERVICES
  # =======================================
  
  # Produit Service (3 instances)
  - job_name: 'produit-service'
    static_configs:
      - targets: 
          - 'produit-service-1:3001'
          - 'produit-service-2:3005'
          - 'produit-service-3:3006'
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Vente Service
  - job_name: 'vente-service'
    static_configs:
      - targets: ['vente-service:3004']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Stock Service
  - job_name: 'stock-service'
    static_configs:
      - targets: ['stock-service:3007']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Reporting Service
  - job_name: 'reporting-service'
    static_configs:
      - targets: ['reporting-service:3008']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 15s

  # =======================================
  # LOAD BALANCER
  # =======================================
  - job_name: 'simple-load-balancer'
    static_configs:
      - targets: ['simple-load-balancer:8000']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # =======================================
  # API GATEWAY
  # =======================================
  - job_name: 'kong-gateway'
    static_configs:
      - targets: ['kong:8000']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

  # =======================================
  # INFRASTRUCTURE
  # =======================================
  
  # Redis Cache
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s
    scrape_timeout: 10s

  # Base de données (si métriques disponibles)
  - job_name: 'mysql-main'
    static_configs:
      - targets: ['mysql-main:3306']
    scrape_interval: 60s
    scrape_timeout: 15s

  - job_name: 'postgres-produit'
    static_configs:
      - targets: ['postgres-produit:5432']
    scrape_interval: 60s
    scrape_timeout: 15s

# =======================================
# ALERTING (optionnel)
# =======================================
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# Note: Règles d'alertes pour l'architecture hybride peuvent être ajoutées dans rule_files en haut
