_format_version: "3.0"
_transform: true

services:
  - name: produit-service
    url: http://produit-service-1:3001
    plugins:
      - name: rate-limiting
        config:
          minute: 100
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - DELETE
          headers:
            - Accept
            - Accept-Version
            - Content-Length
            - Content-MD5
            - Content-Type
            - Date
            - Authorization
          exposed_headers:
            - X-Auth-Token
          credentials: true
          max_age: 3600

  - name: vente-service
    url: http://vente-service:3004
    plugins:
      - name: rate-limiting
        config:
          minute: 100
      - name: cors
        config:
          origins:
            - "*"

  - name: stock-service
    url: http://stock-service:3007
    plugins:
      - name: rate-limiting
        config:
          minute: 100
      - name: cors
        config:
          origins:
            - "*"

  - name: reporting-service
    url: http://reporting-service:3008
    plugins:
      - name: rate-limiting
        config:
          minute: 50
      - name: cors
        config:
          origins:
            - "*"

routes:
  - name: produit-routes
    service: produit-service
    paths:
      - /api/produits

  - name: vente-routes
    service: vente-service
    paths:
      - /api/ventes

  - name: stock-routes
    service: stock-service
    paths:
      - /api/stocks

  - name: reporting-routes
    service: reporting-service
    paths:
      - /api/reports

upstreams:
  - name: produit-upstream
    targets:
      - target: produit-service-1:3001
        weight: 100
      - target: produit-service-2:3005
        weight: 100
      - target: produit-service-3:3006
        weight: 100
    healthchecks:
      active:
        healthy:
          interval: 10
          successes: 3
        unhealthy:
          interval: 10
          tcp_failures: 3
          http_failures: 3
