_format_version: "3.0"

services:
  # Service Produit avec Load Balancer
  - name: produit-service
    url: http://load-balancer:8000
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - X-Client-Type
          exposed_headers:
            - X-Kong-Upstream-Latency
            - X-Kong-Proxy-Latency
          credentials: true
          max_age: 3600
      - name: rate-limiting
        config:
          minute: 200
          hour: 5000
          policy: "local"
      - name: prometheus
        config:
          per_consumer: true

  # Service Vente (Base dédiée)
  - name: vente-service
    url: http://vente-service-compliant:3004
    plugins:
      - name: cors
        config:
          origins: ["*"]
          methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
          headers: ["Accept", "Authorization", "Content-Type", "X-Client-Type"]
          credentials: true
      - name: rate-limiting
        config:
          minute: 150
          hour: 3000
      - name: prometheus

  # Service Stock (Base PostgreSQL dédiée)
  - name: stock-service
    url: http://stock-service-compliant:3007
    plugins:
      - name: cors
        config:
          origins: ["*"]
          methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
          headers: ["Accept", "Authorization", "Content-Type", "X-Client-Type"]
          credentials: true
      - name: rate-limiting
        config:
          minute: 100
          hour: 2000
      - name: prometheus

  # Service Reporting (Multi-sources)
  - name: reporting-service
    url: http://reporting-service-compliant:3008
    plugins:
      - name: cors
        config:
          origins: ["*"]
          methods: ["GET", "POST", "OPTIONS"]
          headers: ["Accept", "Authorization", "Content-Type", "X-Client-Type"]
          credentials: true
      - name: rate-limiting
        config:
          minute: 50
          hour: 1000
      - name: prometheus

  # Legacy System (Base séparée)
  - name: legacy-system
    url: http://legacy-system-compliant:3000
    plugins:
      - name: cors
        config:
          origins: ["*"]
          methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
          headers: ["Accept", "Authorization", "Content-Type", "X-Client-Type"]
          credentials: true
      - name: rate-limiting
        config:
          minute: 300
          hour: 10000
      - name: prometheus

routes:
  # Routes API Modernes (Microservices prioritaires)
  - name: api-produits
    service: produit-service
    paths:
      - /api/produits
    methods:
      - GET
      - POST
      - PUT
      - DELETE
    strip_path: false

  - name: api-ventes
    service: vente-service
    paths:
      - /api/ventes
    methods:
      - GET
      - POST
      - PUT
      - DELETE
    strip_path: false

  - name: api-stock
    service: stock-service
    paths:
      - /api/stock
    methods:
      - GET
      - POST
      - PUT
      - DELETE
    strip_path: false

  - name: api-rapports
    service: reporting-service
    paths:
      - /api/rapports
      - /api/analytics
    methods:
      - GET
      - POST
    strip_path: false

  # Routes POS (Legacy prioritaire - 100%)
  - name: pos-routes
    service: legacy-system
    paths:
      - /pos
    methods:
      - GET
      - POST
      - PUT
      - DELETE
    strip_path: false

  # Routes Maison Mère - Configuration/Magasins (Legacy)
  - name: maisonmere-legacy-routes
    service: legacy-system
    paths:
      - /maisonmere/magasins
      - /maisonmere/config
      - /maisonmere/utilisateurs
      - /maisonmere/dashboard
    methods:
      - GET
      - POST
      - PUT
      - DELETE
    strip_path: false

  # Routes Maison Mère - Rapports (Reporting Service)
  - name: maisonmere-rapports-routes
    service: reporting-service
    paths:
      - /maisonmere/rapports
      - /maisonmere/analytics
      - /maisonmere/export
    methods:
      - GET
      - POST
    strip_path: false

  # Route Maison Mère - Page principale (Legacy)
  - name: maisonmere-main-route
    service: legacy-system
    paths:
      - /maisonmere
    methods:
      - GET
    strip_path: false

  # Health checks (tous services)
  - name: health-checks
    service: produit-service
    paths:
      - /health
    methods:
      - GET
    strip_path: false

plugins:
  # Global plugins
  - name: correlation-id
    config:
      header_name: "X-Kong-Request-ID"
      generator: "uuid"
      echo_downstream: true

  - name: request-transformer
    config:
      add:
        headers:
          - "X-Kong-Microservices: compliant"
          - "X-Architecture: event-driven"

  - name: response-transformer
    config:
      add:
        headers:
          - "X-Kong-Upstream-Status: {{upstream_status}}"
          - "X-Kong-Latency: {{latencies.kong}}ms"

  # Logging global
  - name: file-log
    config:
      path: "/tmp/kong-compliant.log"
      reopen: true
