global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq-broker:15692']
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s

  - job_name: 'rabbitmq-management'
    static_configs:
      - targets: ['rabbitmq-broker:15672']
    metrics_path: /api/metrics
    scrape_interval: 30s
    scrape_timeout: 10s
    basic_auth:
      username: admin
      password: admin123
