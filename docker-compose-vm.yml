version: '3.8'

networks:
  pos-network:
    driver: bridge

volumes:
  postgres_data:

services:
  # === BASE DE DONNÉES SIMPLIFIÉE ===
  postgres-db:
    image: postgres:13
    environment:
      POSTGRES_DB: pos_system
      POSTGRES_USER: pos_user
      POSTGRES_PASSWORD: pos_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pos-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos_user -d pos_system"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === API GATEWAY NGINX ===
  nginx-gateway:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - legacy-system
    networks:
      - pos-network
    restart: unless-stopped

  # === LEGACY SYSTEM ===
  legacy-system:
    build: 
      context: .
      dockerfile: Dockerfile.simple
    environment:
      - PORT=3200
      - SERVICE_TYPE=legacy
      - NODE_ENV=production
    ports:
      - "3200:3200"
    networks:
      - pos-network
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3200/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # === MICROSERVICES ===
  produit-service:
    build: 
      context: .
      dockerfile: Dockerfile.simple
    environment:
      - PORT=3001
      - SERVICE_TYPE=microservice
      - SERVICE_NAME=produit-service
      - NODE_ENV=production
    ports:
      - "3001:3001"
    networks:
      - pos-network
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3

  stock-service:
    build: 
      context: .
      dockerfile: Dockerfile.simple
    environment:
      - PORT=3002
      - SERVICE_TYPE=microservice
      - SERVICE_NAME=stock-service
      - NODE_ENV=production
    ports:
      - "3002:3002"
    networks:
      - pos-network
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3

  vente-service:
    build: 
      context: .
      dockerfile: Dockerfile.simple
    environment:
      - PORT=3003
      - SERVICE_TYPE=microservice
      - SERVICE_NAME=vente-service
      - NODE_ENV=production
    ports:
      - "3003:3003"
    networks:
      - pos-network
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3

  reporting-service:
    build: 
      context: .
      dockerfile: Dockerfile.simple
    environment:
      - PORT=3004
      - SERVICE_TYPE=microservice
      - SERVICE_NAME=reporting-service
      - NODE_ENV=production
    ports:
      - "3004:3004"
    networks:
      - pos-network
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3

  # === MONITORING ===
  prometheus:
    image: prom/prometheus:latest
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus-simple.yml:/etc/prometheus/prometheus.yml
    networks:
      - pos-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    ports:
      - "3030:3000"
    volumes:
      - ./config/grafana:/etc/grafana/provisioning
    networks:
      - pos-network
    restart: unless-stopped
