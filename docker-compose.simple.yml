version: '3.8'

networks:
  pos-network:
    driver: bridge

volumes:
  postgres_data:

services:
  # === BASE DE DONNÉES SIMPLE ===
  postgres-db:
    image: postgres:13
    environment:
      POSTGRES_DB: pos_system
      POSTGRES_USER: pos_user
      POSTGRES_PASSWORD: pos_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pos-network
    restart: unless-stopped

  # === API GATEWAY SIMPLE (NGINX) ===
  nginx-gateway:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - legacy-system
    networks:
      - pos-network
    restart: unless-stopped

  # === LEGACY SYSTEM ===
  legacy-system:
    build: 
      context: .
      dockerfile: Dockerfile.simple
    environment:
      - PORT=3200
      - SERVICE_TYPE=legacy
      - NODE_ENV=production
    ports:
      - "3200:3200"
    networks:
      - pos-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3200/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # === PRODUIT SERVICE ===
  produit-service:
    build: 
      context: .
      dockerfile: Dockerfile.simple
    environment:
      - PORT=3001
      - SERVICE_TYPE=microservice
      - SERVICE_NAME=produit-service
      - NODE_ENV=production
    ports:
      - "3001:3001"
    networks:
      - pos-network
    restart: unless-stopped

  # === STOCK SERVICE ===
  stock-service:
    build: 
      context: .
      dockerfile: Dockerfile.simple
    environment:
      - PORT=3002
      - SERVICE_TYPE=microservice
      - SERVICE_NAME=stock-service
      - NODE_ENV=production
    ports:
      - "3002:3002"
    networks:
      - pos-network
    restart: unless-stopped

  # === VENTE SERVICE ===
  vente-service:
    build: 
      context: .
      dockerfile: Dockerfile.simple
    environment:
      - PORT=3003
      - SERVICE_TYPE=microservice
      - SERVICE_NAME=vente-service
      - NODE_ENV=production
    ports:
      - "3003:3003"
    networks:
      - pos-network
    restart: unless-stopped

  # === REPORTING SERVICE ===
  reporting-service:
    build: 
      context: .
      dockerfile: Dockerfile.simple
    environment:
      - PORT=3004
      - SERVICE_TYPE=microservice
      - SERVICE_NAME=reporting-service
      - NODE_ENV=production
    ports:
      - "3004:3004"
    networks:
      - pos-network
    restart: unless-stopped

  # === MONITORING SIMPLE ===
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus-simple.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - pos-network
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
