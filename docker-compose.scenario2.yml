version: '3.8'

services:
  db:
    image: postgres:15
    container_name: db
    environment:
      POSTGRES_DB: posdb
      POSTGRES_USER: posuser
      POSTGRES_PASSWORD: pospass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "posuser"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - custom_network

  api1:
    build: .
    image: log430_lab_tb_api
    container_name: api1
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://posuser:pospass@db:5432/posdb
      DB_HOST: db
      DB_NAME: posdb
      DB_USER: posuser
      DB_PASS: pospass
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - custom_network

  api2:
    build: .
    image: log430_lab_tb_api
    container_name: api2
    ports:
      - "3002:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://posuser:pospass@db:5432/posdb
      DB_HOST: db
      DB_NAME: posdb
      DB_USER: posuser
      DB_PASS: pospass
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - custom_network

  api3:
    build: .
    image: log430_lab_tb_api
    container_name: api3
    ports:
      - "3003:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://posuser:pospass@db:5432/posdb
      DB_HOST: db
      DB_NAME: posdb
      DB_USER: posuser
      DB_PASS: pospass
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - custom_network

  api4:
    build: .
    image: log430_lab_tb_api
    container_name: api4
    ports:
      - "3004:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://posuser:pospass@db:5432/posdb
      DB_HOST: db
      DB_NAME: posdb
      DB_USER: posuser
      DB_PASS: pospass
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - custom_network

  loadbalancer:
    image: nginx:latest
    container_name: loadbalancer
    ports:
      - "8000:8000"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
      api3:
        condition: service_healthy
      api4:
        condition: service_healthy
    networks:
      - custom_network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    networks:
      - custom_network
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - custom_network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    networks:
      - custom_network
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3030:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - custom_network

networks:
  custom_network:
    driver: bridge

volumes:
  pgdata:
