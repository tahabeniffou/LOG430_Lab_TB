networks:
  pos-network:
    driver: bridge

volumes:
  kong-data:
  postgres-produit-data:
  postgres-stock-data:
  postgres-vente-data:
  postgres-reporting-data:
  prometheus-data:
  grafana-data:
  postgres-compte-data:
  postgres-panier-data:
  postgres-checkout-data:

services:
  # =====================================
  # BASES DE DONNÉES POSTGRESQL
  # =====================================
  postgres-produit:
    image: postgres:15
    environment:
      POSTGRES_DB: produit_db
      POSTGRES_USER: produit_user
      POSTGRES_PASSWORD: produit_password
    volumes:
      - postgres-produit-data:/var/lib/postgresql/data
    networks:
      - pos-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U produit_user -d produit_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres-stock:
    image: postgres:15
    environment:
      POSTGRES_DB: stock_db
      POSTGRES_USER: stock_user
      POSTGRES_PASSWORD: stock_password
    volumes:
      - postgres-stock-data:/var/lib/postgresql/data
    networks:
      - pos-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_user -d stock_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres-vente:
    image: postgres:15
    environment:
      POSTGRES_DB: vente_db
      POSTGRES_USER: vente_user
      POSTGRES_PASSWORD: vente_password
    volumes:
      - postgres-vente-data:/var/lib/postgresql/data
    networks:
      - pos-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vente_user -d vente_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres-reporting:
    image: postgres:15
    environment:
      POSTGRES_DB: reporting_db
      POSTGRES_USER: reporting_user
      POSTGRES_PASSWORD: reporting_password
    volumes:
      - postgres-reporting-data:/var/lib/postgresql/data
    networks:
      - pos-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reporting_user -d reporting_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =====================================
  # KONG API GATEWAY
  # =====================================
  kong-db:
    image: postgres:15
    environment:
      POSTGRES_DB: kong
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong_password
    volumes:
      - kong-data:/var/lib/postgresql/data
    networks:
      - pos-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong -d kong"]
      interval: 30s
      timeout: 10s
      retries: 3

  kong-migrations:
    image: kong:3.4
    command: kong migrations bootstrap
    depends_on:
      kong-db:
        condition: service_healthy
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong_password
      KONG_PG_DATABASE: kong
    networks:
      - pos-network

  kong-migrations-up:
    image: kong:3.4
    command: kong migrations up && kong migrations finish
    depends_on:
      kong-migrations:
        condition: service_completed_successfully
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong_password
      KONG_PG_DATABASE: kong
    networks:
      - pos-network

  kong:
    image: kong:3.4
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong_password
      KONG_PG_DATABASE: kong
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
    depends_on:
      kong-migrations-up:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"
      - "8443:8443"
      - "8444:8444"
      - "8445:8445"
    networks:
      - pos-network
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # =====================================
  # MICROSERVICE PRODUIT (2 instances)
  # =====================================
  produit-service-1:
    build:
      context: ./microservices/produit-service
      dockerfile: Dockerfile
    environment:
      - PORT=3001
      - NODE_ENV=production
      - INSTANCE_ID=produit-instance-1
      - INSTANCE_NAME=Produit Service 1
      - DATABASE_TYPE=postgres
      - DATABASE_URL=postgresql://produit_user:produit_password@postgres-produit:5432/produit_db
    ports:
      - "3001:3001"
    depends_on:
      postgres-produit:
        condition: service_healthy
    networks:
      - pos-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  produit-service-2:
    build:
      context: ./microservices/produit-service
      dockerfile: Dockerfile
    environment:
      - PORT=3001
      - NODE_ENV=production
      - INSTANCE_ID=produit-instance-2
      - INSTANCE_NAME=Produit Service 2
      - DATABASE_TYPE=postgres
      - DATABASE_URL=postgresql://produit_user:produit_password@postgres-produit:5432/produit_db
    ports:
      - "3011:3001"
    depends_on:
      postgres-produit:
        condition: service_healthy
    networks:
      - pos-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =====================================
  # MICROSERVICE STOCK (2 instances)
  # =====================================
  stock-service-1:
    build:
      context: ./microservices/stock-service
      dockerfile: Dockerfile
    environment:
      - PORT=3002
      - NODE_ENV=production
      - INSTANCE_ID=stock-instance-1
      - INSTANCE_NAME=Stock Service 1
      - DATABASE_TYPE=postgres
      - DATABASE_URL=postgresql://stock_user:stock_password@postgres-stock:5432/stock_db
    ports:
      - "3002:3002"
    depends_on:
      postgres-stock:
        condition: service_healthy
    networks:
      - pos-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  stock-service-2:
    build:
      context: ./microservices/stock-service
      dockerfile: Dockerfile
    environment:
      - PORT=3002
      - NODE_ENV=production
      - INSTANCE_ID=stock-instance-2
      - INSTANCE_NAME=Stock Service 2
      - DATABASE_TYPE=postgres
      - DATABASE_URL=postgresql://stock_user:stock_password@postgres-stock:5432/stock_db
    ports:
      - "3012:3002"
    depends_on:
      postgres-stock:
        condition: service_healthy
    networks:
      - pos-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =====================================
  # MICROSERVICE VENTE (2 instances)
  # =====================================
  vente-service-1:
    build:
      context: ./microservices/vente-service
      dockerfile: Dockerfile
    environment:
      - PORT=3003
      - NODE_ENV=production
      - INSTANCE_ID=vente-instance-1
      - INSTANCE_NAME=Vente Service 1
      - DATABASE_TYPE=postgres
      - DATABASE_URL=postgresql://vente_user:vente_password@postgres-vente:5432/vente_db
    ports:
      - "3003:3003"
    depends_on:
      postgres-vente:
        condition: service_healthy
    networks:
      - pos-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  vente-service-2:
    build:
      context: ./microservices/vente-service
      dockerfile: Dockerfile
    environment:
      - PORT=3003
      - NODE_ENV=production
      - INSTANCE_ID=vente-instance-2
      - INSTANCE_NAME=Vente Service 2
      - DATABASE_TYPE=postgres
      - DATABASE_URL=postgresql://vente_user:vente_password@postgres-vente:5432/vente_db
    ports:
      - "3013:3003"
    depends_on:
      postgres-vente:
        condition: service_healthy
    networks:
      - pos-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =====================================
  # MICROSERVICE REPORTING (2 instances)
  # =====================================
  reporting-service-1:
    build:
      context: ./microservices/reporting-service
      dockerfile: Dockerfile
    environment:
      - PORT=3004
      - NODE_ENV=production
      - INSTANCE_ID=reporting-instance-1
      - INSTANCE_NAME=Reporting Service 1
      - DATABASE_TYPE=postgres
      - DATABASE_URL=postgresql://reporting_user:reporting_password@postgres-reporting:5432/reporting_db
    ports:
      - "3004:3004"
    depends_on:
      postgres-reporting:
        condition: service_healthy
    networks:
      - pos-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  reporting-service-2:
    build:
      context: ./microservices/reporting-service
      dockerfile: Dockerfile
    environment:
      - PORT=3004
      - NODE_ENV=production
      - INSTANCE_ID=reporting-instance-2
      - INSTANCE_NAME=Reporting Service 2
      - DATABASE_TYPE=postgres
      - DATABASE_URL=postgresql://reporting_user:reporting_password@postgres-reporting:5432/reporting_db
    ports:
      - "3014:3004"
    depends_on:
      postgres-reporting:
        condition: service_healthy
    networks:
      - pos-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =====================================
  # SERVICE LEGACY
  # =====================================
  legacy-service:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PORT=3000
      - NODE_ENV=production
      - INSTANCE_ID=legacy-instance
      - INSTANCE_NAME=Legacy Service
      - DATABASE_TYPE=sqlite
      - DATABASE_PATH=/app/database.sqlite
    ports:
      - "3000:3000"
    volumes:
      - ./database.sqlite:/app/database.sqlite:rw
    networks:
      - pos-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =====================================
  # CONFIGURATION KONG
  # =====================================
  kong-config:
    image: kong:3.4
    depends_on:
      kong:
        condition: service_healthy
      produit-service-1:
        condition: service_healthy
      produit-service-2:
        condition: service_healthy
      stock-service-1:
        condition: service_healthy
      stock-service-2:
        condition: service_healthy
      vente-service-1:
        condition: service_healthy
      vente-service-2:
        condition: service_healthy
      reporting-service-1:
        condition: service_healthy
      reporting-service-2:
        condition: service_healthy
    environment:
      KONG_ADMIN_URL: http://kong:8001
    volumes:
      - ./config/kong-config.sh:/kong-config.sh:ro
    command: sh /kong-config.sh
    networks:
      - pos-network

  # =====================================
  # MONITORING : PROMETHEUS
  # =====================================
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - pos-network

  # =====================================
  # MONITORING : GRAFANA
  # =====================================
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3008:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - pos-network

  # =====================================
  # BASES DE DONNÉES POUR NOUVEAUX MICROSERVICES
  # =====================================
  postgres-compte:
    image: postgres:15
    environment:
      POSTGRES_DB: compte_db
      POSTGRES_USER: compte_user
      POSTGRES_PASSWORD: compte_password
    volumes:
      - postgres-compte-data:/var/lib/postgresql/data
    networks:
      - pos-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compte_user -d compte_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres-panier:
    image: postgres:15
    environment:
      POSTGRES_DB: panier_db
      POSTGRES_USER: panier_user
      POSTGRES_PASSWORD: panier_password
    volumes:
      - postgres-panier-data:/var/lib/postgresql/data
    networks:
      - pos-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panier_user -d panier_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres-checkout:
    image: postgres:15
    environment:
      POSTGRES_DB: checkout_db
      POSTGRES_USER: checkout_user
      POSTGRES_PASSWORD: checkout_password
    volumes:
      - postgres-checkout-data:/var/lib/postgresql/data
    networks:
      - pos-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkout_user -d checkout_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =====================================
  # MICROSERVICES E-COMMERCE (2 INSTANCES CHACUN)
  # =====================================
  
  # Compte Service - Instance 1
  compte-service-1:
    build: ./microservices/compte-service
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=production
      - PORT=3005
      - INSTANCE_ID=compte-instance-1
      - INSTANCE_NAME=Compte Service 1
      - DB_HOST=postgres-compte
      - DB_PORT=5432
      - DB_NAME=compte_db
      - DB_USER=compte_user
      - DB_PASSWORD=compte_password
      - JWT_SECRET=super-secret-jwt-key-for-pos-system
    depends_on:
      - postgres-compte
    networks:
      - pos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Compte Service - Instance 2
  compte-service-2:
    build: ./microservices/compte-service
    ports:
      - "3015:3005"
    environment:
      - NODE_ENV=production
      - PORT=3005
      - INSTANCE_ID=compte-instance-2
      - INSTANCE_NAME=Compte Service 2
      - DB_HOST=postgres-compte
      - DB_PORT=5432
      - DB_NAME=compte_db
      - DB_USER=compte_user
      - DB_PASSWORD=compte_password
      - JWT_SECRET=super-secret-jwt-key-for-pos-system
    depends_on:
      - postgres-compte
    networks:
      - pos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Panier Service - Instance 1
  panier-service-1:
    build: ./microservices/panier-service
    ports:
      - "3006:3006"
    environment:
      - NODE_ENV=production
      - PORT=3006
      - INSTANCE_ID=panier-instance-1
      - INSTANCE_NAME=Panier Service 1
      - DB_HOST=postgres-panier
      - DB_PORT=5432
      - DB_NAME=panier_db
      - DB_USER=panier_user
      - DB_PASSWORD=panier_password
      - PRODUIT_SERVICE_URL=http://kong:8000/api/produits
    depends_on:
      - postgres-panier
    networks:
      - pos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3006/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Panier Service - Instance 2
  panier-service-2:
    build: ./microservices/panier-service
    ports:
      - "3016:3006"
    environment:
      - NODE_ENV=production
      - PORT=3006
      - INSTANCE_ID=panier-instance-2
      - INSTANCE_NAME=Panier Service 2
      - DB_HOST=postgres-panier
      - DB_PORT=5432
      - DB_NAME=panier_db
      - DB_USER=panier_user
      - DB_PASSWORD=panier_password
      - PRODUIT_SERVICE_URL=http://kong:8000/api/produits
    depends_on:
      - postgres-panier
    networks:
      - pos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3006/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Checkout Service - Instance 1
  checkout-service-1:
    build: ./microservices/checkout-service
    ports:
      - "3007:3007"
    environment:
      - NODE_ENV=production
      - PORT=3007
      - INSTANCE_ID=checkout-instance-1
      - INSTANCE_NAME=Checkout Service 1
      - DB_HOST=postgres-checkout
      - DB_PORT=5432
      - DB_NAME=checkout_db
      - DB_USER=checkout_user
      - DB_PASSWORD=checkout_password
      - PANIER_SERVICE_URL=http://kong:8000/api/paniers
      - STOCK_SERVICE_URL=http://kong:8000/api/stocks
      - VENTE_SERVICE_URL=http://kong:8000/api/ventes
    depends_on:
      - postgres-checkout
    networks:
      - pos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3007/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Checkout Service - Instance 2
  checkout-service-2:
    build: ./microservices/checkout-service
    ports:
      - "3017:3007"
    environment:
      - NODE_ENV=production
      - PORT=3007
      - INSTANCE_ID=checkout-instance-2
      - INSTANCE_NAME=Checkout Service 2
      - DB_HOST=postgres-checkout
      - DB_PORT=5432
      - DB_NAME=checkout_db
      - DB_USER=checkout_user
      - DB_PASSWORD=checkout_password
      - PANIER_SERVICE_URL=http://kong:8000/api/paniers
      - STOCK_SERVICE_URL=http://kong:8000/api/stocks
      - VENTE_SERVICE_URL=http://kong:8000/api/ventes
    depends_on:
      - postgres-checkout
    networks:
      - pos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3007/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =====================================
  # SAGA ORCHESTRATOR SERVICE
  # =====================================
  saga-orchestrator-service:
    build:
      context: ./microservices/saga-orchestrator-service
      dockerfile: Dockerfile
    environment:
      - PORT=8010
      - NODE_ENV=production
      - INSTANCE_ID=saga-orchestrator-1
      - INSTANCE_NAME=Saga Orchestrator Service
      - PRODUIT_SERVICE_URL=http://stock-service-1:3002
      - STOCK_SERVICE_URL=http://stock-service-1:3002
      - VENTE_SERVICE_URL=http://vente-service-1:3003
      - COMPTE_SERVICE_URL=http://compte-service-1:3005
      - LOG_LEVEL=info
    ports:
      - "8010:8010"
    depends_on:
      - produit-service-1
      - stock-service-1
      - vente-service-1
      - compte-service-1
    networks:
      - pos-network
    volumes:
      - ./microservices/saga-orchestrator-service/logs:/usr/src/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8010/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
