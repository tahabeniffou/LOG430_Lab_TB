version: '3.8'

# Architecture Hybride Complete - Deployment Unique
# Système de base + 4 microservices essentiels + Routeur intelligent

services:
  # =======================================
  # BASES DE DONNÉES
  # =======================================
  
  postgres-produit:
    image: postgres:15
    container_name: postgres-produit-db
    environment:
      POSTGRES_DB: produit_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped

  mysql-main:
    image: mysql:8.0
    container_name: mysql-main-db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: main_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init-hybrid-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis-cache
    ports:
      - "6379:6379"
    networks:
      - app-network
    restart: unless-stopped

  # =======================================
  # SYSTÈME DE BASE (LEGACY)
  # =======================================
  
  legacy-system:
    build:
      context: .
      dockerfile: Dockerfile.legacy
    container_name: legacy-system
    environment:
      - PORT=3000
      - DB_HOST=mysql-main
      - DB_PORT=3306
      - DB_NAME=main_db
      - DB_USER=root
      - DB_PASSWORD=password
      - REDIS_URL=redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      - mysql-main
      - redis
    networks:
      - app-network
    restart: unless-stopped

  # =======================================
  # MICROSERVICES
  # =======================================

  produit-service-1:
    build: ./microservices/produit-service
    container_name: produit-service-1
    environment:
      - PORT=3001
      - DB_HOST=postgres-produit
      - DB_PORT=5432
      - DB_NAME=produit_service
      - DB_USER=postgres
      - DB_PASSWORD=password
      - INSTANCE_ID=1
    ports:
      - "3001:3001"
    depends_on:
      - postgres-produit
    networks:
      - app-network
    restart: unless-stopped

  produit-service-2:
    build: ./microservices/produit-service
    container_name: produit-service-2
    environment:
      - PORT=3005
      - DB_HOST=postgres-produit
      - DB_PORT=5432
      - DB_NAME=produit_service
      - DB_USER=postgres
      - DB_PASSWORD=password
      - INSTANCE_ID=2
    ports:
      - "3005:3005"
    depends_on:
      - postgres-produit
    networks:
      - app-network
    restart: unless-stopped

  produit-service-3:
    build: ./microservices/produit-service
    container_name: produit-service-3
    environment:
      - PORT=3006
      - DB_HOST=postgres-produit
      - DB_PORT=5432
      - DB_NAME=produit_service
      - DB_USER=postgres
      - DB_PASSWORD=password
      - INSTANCE_ID=3
    ports:
      - "3006:3006"
    depends_on:
      - postgres-produit
    networks:
      - app-network
    restart: unless-stopped

  vente-service:
    build: ./microservices/vente-service
    container_name: vente-service
    environment:
      - PORT=3004
      - DB_HOST=mysql-main
      - DB_PORT=3306
      - DB_NAME=main_db
      - DB_USER=root
      - DB_PASSWORD=password
      - PRODUIT_SERVICE_URL=http://produit-service-1:3001
      - STOCK_SERVICE_URL=http://stock-service:3007
    ports:
      - "3004:3004"
    depends_on:
      - mysql-main
      - produit-service-1
      - stock-service
    networks:
      - app-network
    restart: unless-stopped

  stock-service:
    build: ./microservices/stock-service
    container_name: stock-service
    environment:
      - PORT=3007
      - DB_HOST=mysql-main
      - DB_PORT=3306
      - DB_NAME=main_db
      - DB_USER=root
      - DB_PASSWORD=password
    ports:
      - "3007:3007"
    depends_on:
      - mysql-main
    networks:
      - app-network
    restart: unless-stopped

  reporting-service:
    build: ./microservices/reporting-service
    container_name: reporting-service
    environment:
      - PORT=3008
      - VENTE_SERVICE_URL=http://vente-service:3004
      - STOCK_SERVICE_URL=http://stock-service:3007
      - PRODUIT_SERVICE_URL=http://produit-service-1:3001
      - REDIS_URL=redis://redis:6379
    ports:
      - "3008:3008"
    depends_on:
      - redis
      - vente-service
      - stock-service
      - produit-service-1
    networks:
      - app-network
    restart: unless-stopped

  # =======================================
  # ROUTEUR HYBRIDE
  # =======================================
  
  hybrid-router:
    build:
      context: .
      dockerfile: Dockerfile.hybrid-router
    container_name: hybrid-router
    environment:
      - PORT=9000
      - LEGACY_SYSTEM_URL=http://legacy-system:3000
      - PRODUIT_SERVICE_URL=http://produit-service-1:3001
      - VENTE_SERVICE_URL=http://vente-service:3004
      - STOCK_SERVICE_URL=http://stock-service:3007
      - REPORTING_SERVICE_URL=http://reporting-service:3008
    ports:
      - "9000:9000"
    depends_on:
      - legacy-system
      - produit-service-1
      - vente-service
      - stock-service
      - reporting-service
    networks:
      - app-network
    restart: unless-stopped

  # =======================================
  # LOAD BALANCER
  # =======================================

  load-balancer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: load-balancer
    environment:
      - PORT=8000
      - TARGET_SERVICES=http://produit-service-1:3001,http://produit-service-2:3005,http://produit-service-3:3006
    ports:
      - "8000:8000"
    depends_on:
      - produit-service-1
      - produit-service-2
      - produit-service-3
    networks:
      - app-network
    restart: unless-stopped

  # =======================================
  # API GATEWAY
  # =======================================

  kong:
    image: kong:3.0
    container_name: kong-gateway
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong-hybrid.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./config/kong-hybrid.yml:/kong/declarative/kong-hybrid.yml
    ports:
      - "8001:8000"  # Proxy
      - "8002:8001"  # Admin API
    depends_on:
      - hybrid-router
    networks:
      - app-network
    restart: unless-stopped

  # =======================================
  # MONITORING
  # =======================================

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus-hybrid.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - app-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3333:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres_data:
  mysql_data:
  grafana_data:

networks:
  app-network:
    driver: bridge
