version: '3.8'

services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.hybrid-router
    ports:
      - "9000:9000"
    environment:
      - NODE_ENV=production
      - PRODUIT_SERVICE_URLS=http://produit-service-1:3001,http://produit-service-2:3011,http://produit-service-3:3021
      - STOCK_SERVICE_URLS=http://stock-service-1:3002,http://stock-service-2:3012,http://stock-service-3:3022
      - VENTE_SERVICE_URLS=http://vente-service-1:3004,http://vente-service-2:3014,http://vente-service-3:3024
      - REPORTING_SERVICE_URLS=http://reporting-service-1:3005,http://reporting-service-2:3015,http://reporting-service-3:3025
      - LEGACY_SERVICE_URL=http://legacy-app:3030
      - PROMETHEUS_ENABLED=true
    depends_on:
      - produit-service-1
      - produit-service-2
      - produit-service-3
      - stock-service-1
      - stock-service-2
      - stock-service-3
      - vente-service-1
      - vente-service-2
      - vente-service-3
      - reporting-service-1
      - reporting-service-2
      - reporting-service-3
    networks:
      - pos-network

  produit-service-1:
    build: ./microservices/produit-service
    ports: ["3001:3001"]
    volumes: ["produit_data_1:/app/data"]
    networks: [pos-network]
  produit-service-2:
    build: ./microservices/produit-service
    ports: ["3011:3011"]
    volumes: ["produit_data_2:/app/data"]
    networks: [pos-network]
  produit-service-3:
    build: ./microservices/produit-service
    ports: ["3021:3021"]
    volumes: ["produit_data_3:/app/data"]
    networks: [pos-network]

  stock-service-1:
    build: ./microservices/stock-service
    ports: ["3002:3002"]
    volumes: ["stock_data_1:/app/data"]
    networks: [pos-network]
  stock-service-2:
    build: ./microservices/stock-service
    ports: ["3012:3012"]
    volumes: ["stock_data_2:/app/data"]
    networks: [pos-network]
  stock-service-3:
    build: ./microservices/stock-service
    ports: ["3022:3022"]
    volumes: ["stock_data_3:/app/data"]
    networks: [pos-network]

  vente-service-1:
    build: ./microservices/vente-service
    ports: ["3004:3004"]
    volumes: ["vente_data_1:/app/data"]
    networks: [pos-network]
  vente-service-2:
    build: ./microservices/vente-service
    ports: ["3014:3014"]
    volumes: ["vente_data_2:/app/data"]
    networks: [pos-network]
  vente-service-3:
    build: ./microservices/vente-service
    ports: ["3024:3024"]
    volumes: ["vente_data_3:/app/data"]
    networks: [pos-network]

  reporting-service-1:
    build: ./microservices/reporting-service
    ports: ["3005:3005"]
    volumes: ["reporting_data_1:/app/data"]
    networks: [pos-network]
  reporting-service-2:
    build: ./microservices/reporting-service
    ports: ["3015:3015"]
    volumes: ["reporting_data_2:/app/data"]
    networks: [pos-network]
  reporting-service-3:
    build: ./microservices/reporting-service
    ports: ["3025:3025"]
    volumes: ["reporting_data_3:/app/data"]
    networks: [pos-network]

  legacy-app:
    build:
      context: .
      dockerfile: Dockerfile.legacy
    ports: ["3030:3000"]
    volumes: ["legacy_data:/app/data"]
    networks: [pos-network]

  prometheus:
    image: prom/prometheus:v2.45.0
    ports: ["9090:9090"]
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks: [pos-network]

  grafana:
    image: grafana/grafana-oss:9.5.15
    ports: ["3030:3000"]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources
    networks: [pos-network]

  node-exporter:
    image: prom/node-exporter:v1.6.1
    ports: ["9100:9100"]
    networks: [pos-network]

networks:
  pos-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  produit_data_1:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/produit1
  produit_data_2:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/produit2
  produit_data_3:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/produit3
  stock_data_1:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/stock1
  stock_data_2:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/stock2
  stock_data_3:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/stock3
  vente_data_1:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/vente1
  vente_data_2:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/vente2
  vente_data_3:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/vente3
  reporting_data_1:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/reporting1
  reporting_data_2:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/reporting2
  reporting_data_3:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/reporting3
  legacy_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/legacy
  prometheus_data:
    driver: local
  grafana_data:
    driver: local