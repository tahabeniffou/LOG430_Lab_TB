# NGINX load balancer pour API Node.js
# Place ce fichier à la racine du projet ou dans un dossier config/

worker_processes 1;
events { worker_connections 1024; }
http {
  upstream api_backend {
    server api1:3000;
    server api2:3000;
    server api3:3000;
    server api4:3000;
    # Par défaut : Round Robin (ne rien décommenter)
    # Pour Least Connections, décommente la ligne suivante :
    # least_conn;
    # Pour IP Hash, décommente la ligne suivante (et commente least_conn si besoin) :
    # ip_hash;
  }
  server {
    listen 0.0.0.0:8000;
    location / {
      proxy_pass http://api_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
