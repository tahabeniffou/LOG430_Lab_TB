global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Kong Gateway
  - job_name: 'kong'
    static_configs:
      - targets: ['kong:8001']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Microservices Produit
  - job_name: 'produit-service'
    static_configs:
      - targets: ['produit-service-1:3001', 'produit-service-2:3001']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Microservices Stock
  - job_name: 'stock-service'
    static_configs:
      - targets: ['stock-service-1:3002', 'stock-service-2:3002']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Microservices Vente
  - job_name: 'vente-service'
    static_configs:
      - targets: ['vente-service-1:3003', 'vente-service-2:3003']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Microservices Reporting
  - job_name: 'reporting-service'
    static_configs:
      - targets: ['reporting-service-1:3004', 'reporting-service-2:3004']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Service Legacy
  - job_name: 'legacy-service'
    static_configs:
      - targets: ['legacy-service:3000']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # ============================================================
  # SAGA CHOREOGRAPHY SERVICES - LAB 7
  # ============================================================
  
  # Service de Validation Saga
  - job_name: 'validation-service'
    static_configs:
      - targets: ['validation-service-saga:8012']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    honor_labels: true
    params:
      saga: ['choreography']

  # Service de Notification Saga  
  - job_name: 'notification-service'
    static_configs:
      - targets: ['notification-service-saga:8013']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    honor_labels: true
    params:
      saga: ['choreography']

  # Service de Paiement Saga
  - job_name: 'payment-service'
    static_configs:
      - targets: ['payment-service-saga:8014']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    honor_labels: true
    params:
      saga: ['choreography']

  # Service de Réclamation Saga
  - job_name: 'reclamation-service'
    static_configs:
      - targets: ['reclamation-service-saga:8015']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    honor_labels: true
    params:
      saga: ['choreography']

  # RabbitMQ pour Saga Choreography
  - job_name: 'rabbitmq-saga'
    static_configs:
      - targets: ['rabbitmq-saga:15692']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # PostgreSQL Databases Saga
  - job_name: 'postgres-saga'
    static_configs:
      - targets: ['postgres-validation-saga:5432', 'postgres-notification-saga:5432', 'postgres-payment-saga:5432', 'postgres-reclamation-saga:5432']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Node Exporter pour métriques système
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter-saga:9100']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # PostgreSQL Databases
  - job_name: 'postgres-produit'
    static_configs:
      - targets: ['postgres-produit:5432']
    scrape_interval: 60s

  - job_name: 'postgres-stock'
    static_configs:
      - targets: ['postgres-stock:5432']
    scrape_interval: 60s

  - job_name: 'postgres-vente'
    static_configs:
      - targets: ['postgres-vente:5432']
    scrape_interval: 60s

  - job_name: 'postgres-reporting'
    static_configs:
      - targets: ['postgres-reporting:5432']
    scrape_interval: 60s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ===========================================
  # SAGA SERVICES (LAB 6 & LAB 7)
  # ===========================================
  
  # Saga Orchestrator (Lab 6)
  - job_name: 'saga-orchestrator'
    static_configs:
      - targets: ['host.docker.internal:8010']
    scrape_interval: 5s
    metrics_path: '/metrics'
    
  # Reclamation Service (Lab 7)
  - job_name: 'reclamation-service'
    static_configs:
      - targets: ['host.docker.internal:8011']
    scrape_interval: 10s
    metrics_path: '/metrics'

  # Validation Service (Lab 7)
  - job_name: 'validation-service'
    static_configs:
      - targets: ['host.docker.internal:8012']
    scrape_interval: 10s
    metrics_path: '/metrics'

  # Notification Service (Lab 7)
  - job_name: 'notification-service'
    static_configs:
      - targets: ['host.docker.internal:8013']
    scrape_interval: 10s
    metrics_path: '/metrics'

  # Payment Service (Lab 7)
  - job_name: 'payment-service'
    static_configs:
      - targets: ['host.docker.internal:8014']
    scrape_interval: 10s
    metrics_path: '/metrics'
