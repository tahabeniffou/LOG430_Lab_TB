global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'saga-orchestrator'
    static_configs:
      - targets: ['host.docker.internal:8010']
    scrape_interval: 5s
    metrics_path: '/metrics'
    
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter-saga:9100']

  - job_name: 'reclamation-service'
    static_configs:
      - targets: ['host.docker.internal:8011']
    scrape_interval: 10s
    metrics_path: '/metrics'
