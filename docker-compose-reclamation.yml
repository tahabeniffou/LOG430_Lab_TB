networks:
  pos-network:
    driver: bridge

services:
  reclamation-service-saga:
    image: reclamation-service-saga:latest
    container_name: reclamation-service-saga
    environment:
      - NODE_ENV=production
      - PORT=8015
      - DATABASE_URL=postgresql://reclamation_user:reclamation_password@log430_lab_tb-postgres-reclamation-1:5432/reclamation_db
      - RABBITMQ_URL=amqp://rabbitmq:rabbitmq@log430_lab_tb-rabbitmq-1:5672/
      - SERVICE_NAME=reclamation-service
    ports:
      - "8015:8015"
    networks:
      - pos-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8015/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    external_links:
      - log430_lab_tb-postgres-reclamation-1:postgres-reclamation
      - log430_lab_tb-rabbitmq-1:rabbitmq
