name: 🚀 LAB6 Saga Orchestrator CI/CD

on:
  push:
    branches: [ main, develop, POS-Systeme-de-caisse-v1.5 ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18'
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/saga-orchestrator

jobs:
  # 🧪 Tests Unitaires et d'Intégration
  test:
    name: 🧪 Tests Saga Orchestrator
    runs-on: ubuntu-latest
    
    services:
      # Service Prometheus pour tests d'observabilité
      prometheus:
        image: prom/prometheus:latest
        ports:
          - 9090:9090
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: 📦 Install Dependencies
      run: |
        npm ci
        npm install --save-dev jest supertest
        
    - name: 🏗️ Build Saga Orchestrator
      run: |
        echo "Building Saga Orchestrator..."
        # Vérifier la syntaxe du code
        node -c saga-orchestrator-prometheus.js
        
    - name: 🧪 Run Unit Tests
      run: |
        echo "Running Saga Unit Tests..."
        npm run test:unit || npm test || node scripts/tests/test-saga.js
        
    - name: 🔧 Start Saga Orchestrator
      run: |
        echo "Starting Saga Orchestrator in background..."
        node saga-orchestrator-prometheus.js &
        sleep 10
        # Vérifier que le service est démarré
        curl -f http://localhost:8010/health || exit 1
        
    - name: 🎯 Test Saga Success Scenarios
      run: |
        echo "Testing successful saga scenarios..."
        node scripts/tests/test-saga.js
        
    - name: 💥 Test Saga Failure Scenarios
      run: |
        echo "Testing failure and compensation scenarios..."
        node scripts/tests/test-failure.js
        
    - name: 📊 Test Observability
      run: |
        echo "Testing observability and metrics..."
        # Vérifier les métriques Prometheus
        curl -f http://localhost:8010/metrics | grep "saga_total"
        # Test complet d'observabilité
        timeout 60 node scripts/tests/quick-observability-test.js
        
    - name: 📈 Validate Metrics
      run: |
        echo "Validating Prometheus metrics..."
        # Vérifier que les métriques attendues sont présentes
        METRICS=$(curl -s http://localhost:8010/metrics)
        echo "$METRICS" | grep -q "saga_total" || exit 1
        echo "$METRICS" | grep -q "saga_duration_seconds" || exit 1
        echo "$METRICS" | grep -q "saga_compensations_total" || exit 1
        echo "✅ All expected metrics found!"
        
    - name: 📋 Generate Test Report
      run: |
        echo "Generating test execution report..."
        curl -s http://localhost:8010/saga/analytics > test-report.json
        cat test-report.json
        
    - name: 📤 Upload Test Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          test-report.json
          saga-orchestrator.log
          *.log

  # 🐳 Build et Push Docker Image
  build:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🐳 Setup Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: 🔐 Login to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.DOCKER_REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: 📦 Extract Metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
          
    - name: 🔨 Create Dockerfile
      run: |
        cat > Dockerfile << 'EOF'
        FROM node:18-alpine
        
        # Métadonnées
        LABEL org.opencontainers.image.title="Saga Orchestrator"
        LABEL org.opencontainers.image.description="LAB6 Saga Pattern with Observability"
        LABEL org.opencontainers.image.source="https://github.com/${{ github.repository }}"
        
        # Répertoire de travail
        WORKDIR /app
        
        # Copier les fichiers de dépendances
        COPY package*.json ./
        
        # Installer les dépendances
        RUN npm ci --only=production && npm cache clean --force
        
        # Copier le code source
        COPY saga-orchestrator-prometheus.js ./
        COPY scripts/demo/observability-full-demo.js ./
        COPY scripts/tests/test-*.js ./
        
        # Créer un utilisateur non-root
        RUN addgroup -g 1001 -S saga && \
            adduser -S saga -u 1001 -G saga
        USER saga
        
        # Exposer les ports
        EXPOSE 8010
        
        # Health check
        HEALTHCHECK --interval=30s --timeout=3s --start-period=5s --retries=3 \
            CMD node -e "const http=require('http'); http.get('http://localhost:8010/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        
        # Commande de démarrage
        CMD ["node", "saga-orchestrator-prometheus.js"]
        EOF
        
    - name: 🏗️ Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # 🚀 Tests d'Intégration avec Docker
  integration-test:
    name: 🚀 Integration Tests
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🐳 Setup Docker Environment
      run: |
        docker --version
        docker-compose --version
        
    - name: 🔐 Login to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.DOCKER_REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: 🏗️ Start Monitoring Stack
      run: |
        echo "Starting Prometheus and Grafana..."
        docker-compose -f docker-compose-monitoring.yml up -d
        
        # Attendre que les services soient prêts
        timeout 60 bash -c 'until curl -f http://localhost:9090/-/healthy; do sleep 2; done'
        timeout 60 bash -c 'until curl -f http://localhost:3000/api/health; do sleep 2; done'
        
    - name: 🎯 Run Integration Tests
      run: |
        echo "Running full integration tests..."
        
        # Utiliser l'image Docker buildée
        IMAGE_TAG=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        
        # Démarrer le Saga Orchestrator
        docker run -d --name saga-test --network host $IMAGE_TAG
        
        # Attendre le démarrage
        timeout 60 bash -c 'until curl -f http://localhost:8010/health; do sleep 2; done'
        
        # Exécuter les tests d'observabilité
        docker exec saga-test node scripts/demo/observability-full-demo.js
        
        # Vérifier les métriques dans Prometheus
        curl -s "http://localhost:9090/api/v1/query?query=saga_total" | jq '.data.result[0].value[1]'
        
    - name: 📊 Validate Dashboard Data
      run: |
        echo "Validating Grafana dashboard data..."
        
        # Vérifier que Grafana peut accéder aux données Prometheus
        DATASOURCE_TEST=$(curl -s http://admin:admin123@localhost:3000/api/datasources/proxy/1/api/v1/query?query=up)
        echo $DATASOURCE_TEST | jq '.data.result | length'
        
        # Vérifier la présence de données saga
        SAGA_DATA=$(curl -s http://admin:admin123@localhost:3000/api/datasources/proxy/1/api/v1/query?query=saga_total)
        echo $SAGA_DATA | jq '.data.result | length'
        
    - name: 🧹 Cleanup
      if: always()
      run: |
        docker-compose -f docker-compose-monitoring.yml down -v
        docker stop saga-test || true
        docker rm saga-test || true

  # 📊 Performance Tests
  performance-test:
    name: 📊 Performance Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'performance')
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🔧 Install k6
      run: |
        sudo gpg -k
        sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
        echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install k6
        
    - name: 🚀 Start Saga Service
      run: |
        IMAGE_TAG=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        docker run -d --name saga-perf -p 8010:8010 $IMAGE_TAG
        
        # Attendre le démarrage
        timeout 60 bash -c 'until curl -f http://localhost:8010/health; do sleep 2; done'
        
    - name: ⚡ Run Performance Tests
      run: |
        echo "Running performance tests with k6..."
        
        # Test de charge avec k6
        k6 run --vus 10 --duration 30s tests/k6-load-test.js
        
        # Test de stress
        k6 run --vus 20 --duration 60s tests/k6-load-test-advanced.js
        
    - name: 📈 Generate Performance Report
      run: |
        echo "Generating performance metrics..."
        curl -s http://localhost:8010/saga/analytics > performance-report.json
        
        # Extraire les métriques clés
        echo "=== PERFORMANCE SUMMARY ===" 
        cat performance-report.json | jq '{
          total_sagas: .total_sagas,
          success_rate: .success_rate,
          avg_duration_ms: .avg_duration_ms,
          p95_duration_ms: .p95_duration_ms
        }'
        
    - name: 📤 Upload Performance Report
      uses: actions/upload-artifact@v4
      with:
        name: performance-results
        path: performance-report.json

  # 🏷️ Release (si tag)
  release:
    name: 🏷️ Create Release
    runs-on: ubuntu-latest
    needs: [test, build, integration-test]
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 📋 Generate Release Notes
      run: |
        cat > RELEASE_NOTES.md << 'EOF'
        # 🚀 LAB6 Saga Orchestrator Release ${{ github.ref_name }}
        
        ## ✨ Features
        - ✅ Saga Pattern Implementation with 3-step transaction
        - ✅ Complete Observability (Prometheus + Grafana)
        - ✅ Automatic Compensation and Rollback
        - ✅ Structured Logging with Winston
        - ✅ Docker Containerization
        
        ## 📊 Performance Metrics
        - 🎯 Success Rate: >90% under load
        - ⚡ P95 Latency: <1s
        - 🔧 100% Compensation Coverage
        - 📈 103 Prometheus Metrics
        
        ## 🐳 Docker Image
        ```bash
        docker pull ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
        docker run -p 8010:8010 ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
        ```
        
        ## 📖 Documentation
        - [State Machine Diagram](documentation/SAGA_STATE_MACHINE.md)
        - [Observability Guide](README.md#observability)
        - [API Documentation](http://localhost:8010)
        EOF
        
    - name: 🎉 Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        body_path: RELEASE_NOTES.md
        files: |
          saga-orchestrator-prometheus.js
          docker-compose-monitoring.yml
          documentation/SAGA_STATE_MACHINE.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 🔔 Notifications
  notify:
    name: 🔔 Notifications
    runs-on: ubuntu-latest
    needs: [test, build, integration-test]
    if: always()
    
    steps:
    - name: 📢 Success Notification
      if: ${{ needs.test.result == 'success' && needs.build.result == 'success' && needs.integration-test.result == 'success' }}
      run: |
        echo "🎉 All tests passed! Saga Orchestrator is ready for production."
        echo "✅ Unit Tests: PASSED"
        echo "✅ Integration Tests: PASSED" 
        echo "✅ Docker Build: PASSED"
        echo "📊 View dashboards at: http://localhost:3000"
        
    - name: ❌ Failure Notification
      if: ${{ needs.test.result == 'failure' || needs.build.result == 'failure' || needs.integration-test.result == 'failure' }}
      run: |
        echo "❌ Some tests failed. Please check the logs."
        echo "🔍 Debug information:"
        echo "- Test Result: ${{ needs.test.result }}"
        echo "- Build Result: ${{ needs.build.result }}"
        echo "- Integration Result: ${{ needs.integration-test.result }}"
