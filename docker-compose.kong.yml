version: '3.8'

services:
  # === INFRASTRUCTURE ===
  kong-database:
    image: postgres:13
    environment:
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong
      POSTGRES_DB: kong
    volumes:
      - kong_data:/var/lib/postgresql/data
    networks:
      - kong-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong"]
      interval: 10s
      timeout: 5s
      retries: 5

  kong-migrations:
    image: kong:3.4
    command: kong migrations bootstrap
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_PG_DATABASE: kong
    depends_on:
      kong-database:
        condition: service_healthy
    networks:
      - kong-net

  kong:
    image: kong:3.4
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_PG_DATABASE: kong
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_URL: http://localhost:8002
    ports:
      - "8000:8000"  # Kong Proxy (API Gateway)
      - "8001:8001"  # Kong Admin API
      - "8002:8002"  # Kong Manager UI
    depends_on:
      - kong-migrations
    networks:
      - kong-net
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 3

  # === BASE DE DONNÉES COMMUNE ===
  postgres-db:
    image: postgres:16
    environment:
      POSTGRES_DB: pos_system
      POSTGRES_USER: pos_user
      POSTGRES_PASSWORD: pos_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pos-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos_user -d pos_system"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === MICROSERVICES - 2 INSTANCES CHACUN ===
  
  # Produit Service - Instance 1
  produit-service-1:
    build: 
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_TYPE: microservice
        SERVICE_NAME: produit-service
        PORT: 3001
    environment:
      - PORT=3001
      - SERVICE_TYPE=microservice
      - SERVICE_NAME=produit-service
      - INSTANCE_ID=produit-1
      - INSTANCE_NAME=Produit Service Instance 1
      - DATABASE_URL=postgres://pos_user:pos_password@postgres-db:5432/pos_system
    ports:
      - "3001:3001"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - pos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Produit Service - Instance 2
  produit-service-2:
    build: ./microservices/produit-service
    environment:
      - PORT=3011
      - INSTANCE_ID=produit-2
      - INSTANCE_NAME=Produit Service Instance 2
      - DATABASE_URL=postgres://pos_user:pos_password@postgres-db:5432/pos_system
    ports:
      - "3011:3011"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - pos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3011/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Stock Service - Instance 1
  stock-service-1:
    build: ./microservices/stock-service
    environment:
      - PORT=3002
      - INSTANCE_ID=stock-1
      - INSTANCE_NAME=Stock Service Instance 1
      - DATABASE_URL=postgres://pos_user:pos_password@postgres-db:5432/pos_system
    ports:
      - "3002:3002"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - pos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Stock Service - Instance 2
  stock-service-2:
    build: ./microservices/stock-service
    environment:
      - PORT=3012
      - INSTANCE_ID=stock-2
      - INSTANCE_NAME=Stock Service Instance 2
      - DATABASE_URL=postgres://pos_user:pos_password@postgres-db:5432/pos_system
    ports:
      - "3012:3012"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - pos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3012/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Vente Service - Instance 1
  vente-service-1:
    build: ./microservices/vente-service
    environment:
      - PORT=3004
      - INSTANCE_ID=vente-1
      - INSTANCE_NAME=Vente Service Instance 1
      - DATABASE_URL=postgres://pos_user:pos_password@postgres-db:5432/pos_system
      - PRODUIT_SERVICE_URLS=http://produit-service-1:3001,http://produit-service-2:3011
      - STOCK_SERVICE_URLS=http://stock-service-1:3002,http://stock-service-2:3012
    ports:
      - "3004:3004"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - pos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Vente Service - Instance 2
  vente-service-2:
    build: ./microservices/vente-service
    environment:
      - PORT=3014
      - INSTANCE_ID=vente-2
      - INSTANCE_NAME=Vente Service Instance 2
      - DATABASE_URL=postgres://pos_user:pos_password@postgres-db:5432/pos_system
      - PRODUIT_SERVICE_URLS=http://produit-service-1:3001,http://produit-service-2:3011
      - STOCK_SERVICE_URLS=http://stock-service-1:3002,http://stock-service-2:3012
    ports:
      - "3014:3014"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - pos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3014/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Reporting Service - Instance 1
  reporting-service-1:
    build: ./microservices/reporting-service
    environment:
      - PORT=3005
      - INSTANCE_ID=reporting-1
      - INSTANCE_NAME=Reporting Service Instance 1
      - DATABASE_URL=postgres://pos_user:pos_password@postgres-db:5432/pos_system
      - PRODUIT_SERVICE_URLS=http://produit-service-1:3001,http://produit-service-2:3011
      - VENTE_SERVICE_URLS=http://vente-service-1:3004,http://vente-service-2:3014
      - STOCK_SERVICE_URLS=http://stock-service-1:3002,http://stock-service-2:3012
    ports:
      - "3005:3005"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - pos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Reporting Service - Instance 2
  reporting-service-2:
    build: ./microservices/reporting-service
    environment:
      - PORT=3015
      - INSTANCE_ID=reporting-2
      - INSTANCE_NAME=Reporting Service Instance 2
      - DATABASE_URL=postgres://pos_user:pos_password@postgres-db:5432/pos_system
      - PRODUIT_SERVICE_URLS=http://produit-service-1:3001,http://produit-service-2:3011
      - VENTE_SERVICE_URLS=http://vente-service-1:3004,http://vente-service-2:3014
      - STOCK_SERVICE_URLS=http://stock-service-1:3002,http://stock-service-2:3012
    ports:
      - "3015:3015"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - pos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3015/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # === CONSOLES (utilisant Kong Gateway) ===
  pos-console:
    build:
      context: .
      dockerfile: Dockerfile.console
      args:
        CONSOLE_TYPE: pos
    environment:
      - API_GATEWAY_URL=http://kong:8000
    depends_on:
      - kong
    networks:
      - pos-network
      - kong-net
    stdin_open: true
    tty: true

  maison-mere-console:
    build:
      context: .
      dockerfile: Dockerfile.console
      args:
        CONSOLE_TYPE: mere
    environment:
      - API_GATEWAY_URL=http://kong:8000
    depends_on:
      - kong
    networks:
      - pos-network
      - kong-net
    stdin_open: true
    tty: true

  # === KONG CONFIGURATION BOOTSTRAP ===
  kong-config:
    image: kong:3.4
    command: >
      sh -c "
        sleep 30 &&
        /usr/local/bin/kong-config.sh
      "
    environment:
      - KONG_ADMIN_URL=http://kong:8001
    depends_on:
      - kong
    networks:
      - kong-net
      - pos-network
    volumes:
      - ./config/kong-config.sh:/usr/local/bin/kong-config.sh:ro

  # ============================================
  # 📊 MONITORING STACK - PROMETHEUS & GRAFANA
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: kong-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus-kong.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - kong-net
      - pos-network
    restart: unless-stopped
    depends_on:
      - kong

  grafana:
    image: grafana/grafana:latest
    container_name: kong-grafana
    ports:
      - "3030:3000"  # Port 3030 pour éviter conflit avec legacy
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
      - GF_SECURITY_ADMIN_USER=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - kong-net
      - pos-network
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  kong_data:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  kong-net:
    driver: bridge
  pos-network:
    driver: bridge
